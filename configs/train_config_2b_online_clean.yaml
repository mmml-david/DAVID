model:
  backbone_name: "Qwen/Qwen3-VL-2B-Instruct"
  backbone_dtype: "bfloat16"
  input_dim: 2048         # Qwen3-VL-2B pooler_output dim (= latent dim)
  n_encoder_layers: 4
  n_decoder_layers: 4
  n_heads: 16
  dropout: 0.1
  progressive_ratio: 0.0    # 0.0 = no mask, 0.5 = token N-1 sees ~N/2 random, 1.0 = sees ~1 random
  grad_checkpoint: true     # recompute activations on backward pass to reduce activation memory

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_steps: 100000
  warmup_steps: 1000
  beta_target: 1.0e-4
  beta_warmup_steps: 10000
  grad_clip: 1.0
  ema_decay: 0.999

data:
  dataset_name: "chancharikm/QualityCheck"
  subset: "PerceptionTest"
  sample_fps: 1.0           # sample 1 frame per second; videos vary in length so token count varies per video
  max_frames: 64            # safety cap to avoid OOM on unusually long videos
  shortest_edge: 16384      # 128*128 — total pixel budget lower bound passed to smart_resize
  longest_edge: 204800      # 320*640 — total pixel budget upper bound passed to smart_resize
  num_workers: 0            # 0 = main process only (required for online mode with backbone on GPU)

logging:
  use_wandb: true
  entity: "mmml-david"
  project: "DAVID"
  run_name: null  # set to a string to name the run, e.g. "baseline-lr1e4"; null = wandb auto-names it
  log_every: 50
  eval_every: 50
  max_val_samples: 30
  save_every: 5000
  checkpoint_dir: "/data/user_data/hsuanhal/11777/DAVID/checkpoints/ethan-2b-online"
